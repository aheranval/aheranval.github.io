<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Running Administration Portal</title>
<link rel="stylesheet" href="running.css">
</head>

<section class="run-card" id="login-section">

</section>

<body>
    
<h2>Admin Login</h2>
<button id="github-login">
🐙 Continue with GitHub
</button>
    
<nav class="menu">
<a href="running.html">Back</a>
</nav>

<main>
<header class="hero">
<h1>Adventure Administration Portal</h1>

<p class="hero-note">
If you are not Alice, leave immediately.

Your unauthorized access has been reported to the snail council ‼️

Your computer now has 67 viruses.
</p>
</header>

<section
    class="run-card"
    id="admin-section"
    style="display:none;">
<h2>New Adventure</h2>

<form id="adventure-form">
<label>Country</label>
<br>
<input id="country" type="text" required>

<br><br>

<label>State/Province</label>
<br>
<input id="state" type="text">

<br><br>

<label>City</label>
<br>
<input id="city" type="text">

<br><br>

<label>Specific Location</label>
<br>
<input id="location" type="text">

<br><br>

<label>Date</label>
<br>
<input id="date" type="date" required>

<br><br>

<label>Distance (miles)</label>
<br>
<input id="distance" type="number" step="0.1" required>

<br><br>

<label>Duration (minutes)</label>
<br>
<input id="duration" type="number">

<br><br>

<label>Time of Day</label>
<br>
<select id="time">
<option>Morning</option>
<option>Afternoon</option>
<option>Evening</option>
</select>

<br><br>

<label>Notes</label>
<br>
<textarea id="notes"></textarea>

<br><br>

<label>Photo Filename</label>
<br>
<input id="photo">

<br><br>

<h3>Passport Stamps</h3>

<label>
<input type="checkbox" value="cold">
🧊 Ran Somewhere Ridiculously Cold
</label>

<br>

<label>
<input type="checkbox" value="heatstroke">
🥵 Heatstroke Any%
</label>

<br>

<label>
<input type="checkbox" value="jetlag">
✈️ Jet Lag Speedrun
</label>

<br>

<label>
<input type="checkbox" value="couples">
❤️ Couples Run
</label>

<br>

<label>
<input type="checkbox" value="main-character">
🌅 Main Character Moment
</label>

<br>

<label>
<input type="checkbox" value="counts">
🏃 I Guess This Counts
</label>

<br><br>

<h3>Difficulty</h3>

<select id="difficulty">
<option>😀 Easy</option>
<option>😐 Fine</option>
<option>🥵 Why</option>
<option>💀 Never Again</option>
</select>

<br><br>

<h3>Rating</h3>

<select id="rating">
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
</select>

<br><br>

<button type="submit">Save Adventure</button>
</form>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="login.js"></script>
<script src="admin.js"></script>
</body>
</html>
